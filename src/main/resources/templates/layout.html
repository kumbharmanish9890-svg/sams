<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | SAMS'">SAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/sams.css" rel="stylesheet">
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');</script>
</head>
<body>
<div th:fragment="sidebar" class="sidebar">
    <h4 class="brand"><i class="bi bi-trophy-fill"></i> SAMS</h4>
    <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/players"><i class="bi bi-people-fill"></i> Players</a>
    <a href="/teams"><i class="bi bi-shield-fill"></i> Teams</a>
     <a href="/loads"><i class="bi bi-clipboard-pulse"></i> Training Load</a>
     <a href="/scout"><i class="bi bi-binoculars-fill"></i> Scouting</a>
    <a href="/injury"><i class="bi bi-heart-pulse-fill"></i> Injury Risk</a>
    <button class="btn btn-sm btn-outline-light mt-4" onclick="toggleTheme()">
        <i class="bi bi-moon-stars"></i> Dark/Light
    </button>
</div>

<div th:fragment="sidebar" class="sidebar">
    <h4 class="brand"><i class="bi bi-trophy-fill"></i> SAMS</h4>
    <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a th:if="${canCoach}" href="/players"><i class="bi bi-people-fill"></i> Players</a>
    <a th:if="${canCoach}" href="/teams"><i class="bi bi-shield-fill"></i> Teams</a>
    <a th:if="${canCoach}" href="/loads"><i class="bi bi-clipboard-pulse"></i> Training Load</a>
    <a th:if="${canCoach}" href="/injury"><i class="bi bi-heart-pulse-fill"></i> Injury Risk</a>
    <a th:if="${canScout}" href="/scout"><i class="bi bi-binoculars-fill"></i> Scouting</a>

    <button class="btn btn-sm btn-outline-light mt-4" onclick="toggleTheme()">
        <i class="bi bi-moon-stars"></i> Dark/Light
    </button>

    <div class="mt-auto text-light small">
        <div class="mb-2"><i class="bi bi-person-circle"></i> <span th:text="${currentUser}">user</span></div>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-sm btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </form>
    </div>
</div>
<script th:fragment="scripts" src="/js/sams.js"></script>
</body>
</html>
