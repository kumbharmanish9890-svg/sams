<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | SAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/sams.css" rel="stylesheet">
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');</script>
</head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <h2 class="text-center mb-1" style="font-weight:800; letter-spacing:3px;">
            <i class="bi bi-trophy-fill" style="color:#ffc83d; filter:drop-shadow(0 0 10px #ffc83d)"></i> SAMS
        </h2>
        <p class="text-center mb-4" style="color:var(--muted)">Sports Analytics Management System</p>

        <div th:if="${param.error}" class="alert alert-danger">Username and password Wrong.</div>
        <div th:if="${param.logout}" class="alert alert-success">Logout</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created. Please login.</div>
        <div th:if="${param.reset}" class="alert alert-success">Password changed. Please login.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-success w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> LOGIN</button>
        </form>
        <div class="d-flex justify-content-between mt-3">
            <a href="/forgot">Forgot password?</a>
            <a href="/register">Create account</a>
        </div>
    </div>
</div>
<script src="/js/sams.js"></script>
</body>
</html>
