<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | SAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/sams.css" rel="stylesheet">
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');</script>
</head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <h3 class="text-center mb-1"><i class="bi bi-key-fill"></i> Reset Password</h3>
        <p class="text-center mb-4" style="color:var(--muted)">Answer your security question</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Step 1: ask for username -->
        <form th:if="${question == null}" th:action="@{/forgot}" method="post">
            <div class="mb-4">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <button class="btn btn-success w-100 py-2">CONTINUE</button>
        </form>

        <!-- Step 2: answer + new password -->
        <form th:if="${question != null}" th:action="@{/forgot/reset}" method="post">
            <input type="hidden" name="username" th:value="${username}">
            <div class="mb-3">
                <label class="form-label">Account</label>
                <input type="text" class="form-control" th:value="${username}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="${question}">Question</label>
                <input type="text" name="answer" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password (min 8 characters)</label>
                <input type="password" name="newPassword" class="form-control" required minlength="8">
            </div>
            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm" class="form-control" required minlength="8">
            </div>
            <button class="btn btn-success w-100 py-2">RESET PASSWORD</button>
        </form>

        <p class="text-center mt-3 mb-0"><a href="/login">Back to Login</a></p>
    </div>
</div>
<script src="/js/sams.js"></script>
</body>
</html>
