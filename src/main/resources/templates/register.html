<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | SAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/sams.css" rel="stylesheet">
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');</script>
</head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <h3 class="text-center mb-1"><i class="bi bi-person-plus-fill"></i> Create Account</h3>
        <p class="text-center mb-4" style="color:var(--muted)">SAMS - Sports Analytics Management System</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" th:value="${username}" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password (min 8 characters)</label>
                <input type="password" name="password" class="form-control" required minlength="8">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm" class="form-control" required minlength="8">
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="COACH">Coach</option>
                    <option value="SCOUT">Scout</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Security Question (for password reset)</label>
                <select name="question" class="form-select">
                    <option th:each="q : ${questions}" th:value="${q}" th:text="${q}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Your Answer</label>
                <input type="text" name="answer" class="form-control" required>
            </div>
            <button class="btn btn-success w-100 py-2">REGISTER</button>
        </form>
        <p class="text-center mt-3 mb-0">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>
<script src="/js/sams.js"></script>
</body>
</html>
